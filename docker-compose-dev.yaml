networks:
  dev:
    name: ${DOCKER_DEV_NETWORK}
    external: true
volumes:
  redis_data:
    driver: local
  pfr_logs:


services:
  api:
    image: ${CONTAINER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    restart: "no"
    environment:
      FP_API_TITLE: "Noise calculation - OGC API Processes"
      FP_API_DESCRIPTION: "An OGC API Processes implementation for noise calculations."

      FP_RESULT_CACHE_HOST: "redis"
      FP_RESULT_CACHE_PORT: 6379
      FP_RESULT_CACHE_DB: 1

      FP_CELERY_BROKER_HOST: "redis"
      FP_CELERY_BROKER_PORT: 6379
      FP_CELERY_BROKER_DB: 0
      FP_CELERY_RESULTS_TTL_DAYS: 7
      FP_CELERY_TASK_TLIMIT_HARD: 1800 # 30 minutes
      FP_CELERY_TASK_TLIMIT_SOFT: 1500 # 25 minutes
      FP_RESULTS_TEMP_TTL_HOURS: 24
      FP_CELERY_JOB_MODE: "False"
      FP_CELERY_QUEUE: "floodrisk-c"

      FP_JOB_STATUS_TTL_DAYS: 7
      FP_SYNC_EXECUTION_TIMEOUT_SECONDS: 10
      FP_LOG_LEVEL: "DEBUG"
      FP_MAX_RESULT_SIZE_BYTES: 99614720 # 95 MB
      FP_MAX_READ_SIZE_BYTES: 104857600 # 100 MB

      PFR_PROCESS_DESCRIPTION_PFR_FILE: "/app/pfr.yaml"
      PFR_PROCESS_DESCRIPTION_PFR_CITYWIDE_FILE: "/app/pfr-citywide.yaml"
    ports:
      - 8000:8000
    command: ['uvicorn', 'app:app', '--host', '0.0.0.0', '--port', '8000']
    networks:
      - dev
    volumes:
      - ./process-descriptions/pfr.yaml:/app/pfr.yaml:ro
      - ./process-descriptions/pfr-citywide.yaml:/app/pfr-citywide.yaml:ro
      - pfr_logs:/app/logs:rw

  worker:
    image: ${CONTAINER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    restart: "no"
    environment:
      FP_RESULT_CACHE_HOST: "redis"
      FP_RESULT_CACHE_PORT: 6379
      FP_RESULT_CACHE_DB: 1
      #
      FP_CELERY_BROKER_HOST: "redis"
      FP_CELERY_BROKER_PORT: 6379
      FP_CELERY_BROKER_DB: 0
      FP_CELERY_RESULTS_TTL_DAYS: 7
      FP_CELERY_TASK_TLIMIT_HARD: 1800 # 30 minutes
      FP_CELERY_TASK_TLIMIT_SOFT: 1500 # 25 minutes
      FP_RESULTS_TEMP_TTL_HOURS: 24
      FP_CELERY_JOB_MODE: "False"
      FP_CELERY_QUEUE: "floodrisk-c"
      FP_JOB_STATUS_TTL_DAYS: 7
      #
      FP_SYNC_EXECUTION_TIMEOUT_SECONDS: 10
      FP_LOG_LEVEL: "DEBUG"
      FP_MAX_RESULT_SIZE_BYTES: 99614720
      FP_MAX_READ_SIZE_BYTES: 104857600 # 100 MB
      #
      PFR_ALLOWED_INPUT_ORIGINS: "https://api.hamburg.de,http://localhost:8000,https://geodata.germanywestcentral.cloudapp.azure.com"
      PFR_PROCESS_DESCRIPTION_PFR_FILE: "/app/pfr.yaml"
      PFR_PROCESS_DESCRIPTION_PFR_CITYWIDE_FILE: "/app/pfr-citywide.yaml"
      PFR_DROP_INVALID_INPUT_FEATURES: "True"
    # ports:
    #   - ${WEBAPP_PORT_CONTAINER}:${WEBAPP_PORT}
    command: ['celery', '-A', 'fastprocesses.worker.celery_app', 'worker', '--loglevel=debug']
    networks:
      - dev

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    expose: 
      - ${REDIS_PORT}
    restart: "unless-stopped"
    command: dragonfly --requirepass "" # --appendonly yes
    networks:
      - dev
    volumes:
      - redis_data:/data