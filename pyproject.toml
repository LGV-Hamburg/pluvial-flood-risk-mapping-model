[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pluvial-flood-risk"
description = "flood risk mapping"
authors = [{name = "Stefan Schuhart", email = "stefan.schuhart@gv.hamburg.de"}]
readme = "README.md"
requires-python = ">=3.14"
keywords = []
dynamic = ["version"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Analytics",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = ""


[tool.ruff]
# same as isort, black
line-length = 88
target-version = "py314"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), isort (`I`) rules.
select = ["E", "F", "I"]


[tool.poetry]
name = "pluvial-flood-risk"
version = "0.1.0"
description = "flood risk mapping"
authors = ["Stefan Schuhart <stefan.schuhart@gv.hamburg.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14,<4.0"

[tool.poetry.group.dev.dependencies]
# formatting, quality, tests
autoflake = ">=2.3"
black = ">=25.0"
isort = ">=5.13"
mypy = ">=1.14"
pytest = ">=8.0"
pytest-cov = ">=6.0"
pytest-randomly = ">=3.15"
pytest-sugar = ">=1.0"
pytest-xdist = ">=3.5"
types-toml = ">=0.10"
pre-commit = ">=4.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
jupyter-book = "^1.0"
sphinx-autoapi = "^3"
sphinxcontrib-autoyaml = "^1.3"

