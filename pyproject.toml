[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pluvial-flood-risk"
description = "flood risk mapping"
authors = [{name = "Stefan Schuhart", email = "stefan.schuhart@gv.hamburg.de"}]
readme = "README.md"
requires-python = ">=3.12"
keywords = []
dynamic = ["version"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14 :: Experimental",
    "Topic :: Analytics",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "fastprocesses (==0.24.0rc5)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.0,<3.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "healpix-geo (>=0.1.2,<0.2.0)",
    "flatgeobuf (>=0.3.1,<0.4.0)",
    "aiohttp (>=3.9,<4.0.0)",
    "tenacity (>=8.2,<10.0.0)",
    "geojson-pydantic (>=2.1.1,<3.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "orjson (>=3.11.9,<4.0.0)",
]

[project.urls]
Homepage = "https://gitlab.opencode.de/lgvhh/udp/urban-pluvial-flood-risk-mapping"


[tool.ruff]
# same as isort, black
line-length = 88
target-version = "py314"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), isort (`I`) rules.
select = ["E", "F", "I"]


[tool.poetry]
name = "pluvial-flood-risk"
version = "0.13.1"
description = "flood risk mapping"
authors = ["Stefan Schuhart <stefan.schuhart@gv.hamburg.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastprocesses = {allow-prereleases = true}

[tool.poetry.group.dev.dependencies]
# formatting, quality, tests
autoflake = ">=2.3"
black = ">=25.0"
isort = ">=5.13"
mypy = ">=1.14"
pytest = ">=8.0"
pytest-cov = ">=6.0"
pytest-randomly = ">=3.15"
pytest-sugar = ">=1.0"
pytest-xdist = ">=3.5"
types-toml = ">=0.10"
pre-commit = ">=4.0"
aiohttp = "^3.14.1"
tenacity = "^9.0"
pydantic-settings = "^2.0"
flower = "^2.0.1"

[tool.pytest.ini_options]
addopts = "-v"
markers = [
    "integration: marks tests as integration tests that require a running Redis instance (deselect with '-m \"not integration\"')",
    "e2e: marks tests that call a running API/worker/redis stack (deselect with '-m \"not e2e\"')",
    "regression: marks tests as regression tests using real example data (no external services required)",
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
jupyter-book = "^1.0"
sphinx-autoapi = "^3"
sphinxcontrib-autoyaml = "^1.1"

