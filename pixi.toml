[project]
name = "pluvial-flood-risk"
version = "0.1.0"
description = "flood risk mapping"
authors = ["Stefan Schuhart <stefan.schuhart@gv.hamburg.de>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "=3.14.*"

[pypi-dependencies]
# Install the project itself in editable mode
pluvial_flood_risk = { path = ".", editable = true }

# --------------------------------------------------------------------------- #
# dev feature: linting, type-checking, testing
# --------------------------------------------------------------------------- #
[feature.dev.dependencies]
pytest = ">=8.0"
mypy = ">=1.14"
pre-commit = ">=4.0"
ruff = ">=0.9"

[feature.dev.pypi-dependencies]
pytest-cov = ">=6.0"
pytest-randomly = ">=3.15"
pytest-sugar = ">=1.0"
pytest-xdist = ">=3.5"
types-toml = ">=0.10"

# --------------------------------------------------------------------------- #
# docs feature
# --------------------------------------------------------------------------- #
[feature.docs.dependencies]
jupyter-book = ">=1.0"
sphinx-autoapi = ">=3"
sphinxcontrib-autoyaml = ">=1.3"

# --------------------------------------------------------------------------- #
# environments
# --------------------------------------------------------------------------- #
[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

# --------------------------------------------------------------------------- #
# tasks  (run with: pixi run <task>)
# --------------------------------------------------------------------------- #
[tasks]
test = "pytest tests/"
lint = "ruff check src/"
format = "ruff format src/"
typecheck = "mypy src/"
