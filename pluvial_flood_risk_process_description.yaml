id: pluvial_flood_risk
title: "Pluvial Flood Risk"
version: "1.0.0"
description: >-
  Calculates building-level pluvial flood risk indices (PFR_WB, PFR_MA)
  following the IPCC risk framework (Vogelbacher et al., 2025): Risk = Hazard^a
  x Exposure^b x Vulnerability^c. The four sub-pipelines run in parallel via a
  scatter-gather pattern.
jobControlOptions:
  - async-execute
outputTransmission:
  - value
inputs:
  buildings:
    title: "Buildings Feature Collection"
    description: >-
      GeoJSON FeatureCollection of building footprints. Each feature must carry
      all socio-economic indicator properties. The population field
      'residents_in_statistical_unit' may be pre-joined onto each building
      feature, or derived automatically from a separate 'statistical_units'
      input (joined by attribute via 'statistical_unit_id', or spatially via
      building centroid when that field is absent).
    schema:
      oneOf:
        - allOf:
            - format: geojson-feature-collection
            - "$ref": "https://geojson.org/schema/FeatureCollection.json"
            - "$ref": "https://gitlab.opencode.de/lgvhh/udp/urban-pluvial-flood-risk-mapping/-/raw/main/schemas/buildings-schema.json"
        - type: object
          required:
            - href
            - type
          properties:
            href:
              type: string
              format: uri
              description: >-
                URI of a remote resource returning a GeoJSON FeatureCollection,
                e.g. an OGC API Features items endpoint.
            type:
              type: string
              enum:
                - application/geo+json
                - application/json
              description: Media type of the remote resource.
            schema:
              type: string
              format: uri
              const: >-
                https://gitlab.opencode.de/lgvhh/udp/urban-pluvial-flood-risk-mapping/-/raw/main/schemas/buildings-schema.json
          additionalProperties: false
    minOccurs: 1
    maxOccurs: 1
  streets:
    title: "Streets Feature Collection"
    description: >-
      GeoJSON FeatureCollection of street centre-line geometries. Used in the
      mobility & accessibility hazard calculation (Step 3) to construct the 15 m
      and 30 m buffer zones around road access.
    schema:
      allOf:
        - format: geojson-feature-collection
        - "$ref": "https://geojson.org/schema/FeatureCollection.json"
        - "$ref": "https://gitlab.opencode.de/lgvhh/udp/urban-pluvial-flood-risk-mapping/-/raw/main/schemas/streets-schema.json"
    minOccurs: 1
    maxOccurs: 1
  statistical_units:
    title: "Statistical Units Feature Collection (optional)"
    description: >-
      GeoJSON FeatureCollection of statistical unit polygons carrying census
      attributes. Required only when 'residents_in_statistical_unit' is not
      pre-joined onto the building features. Each feature must have property:
      'residents' (total registered residents). The statistical-unit living area
      is derived from building geometry + floors + building_type during the
      exposure step. Join strategy (chosen automatically): (1) Attribute join
      — when building features carry a 'statistical_unit_id' property that
      matches the 'statistical_unit_id' of the statistical unit features; (2)
      Spatial join — otherwise, the centroid of each building footprint is
      tested against the statistical unit polygons ('within' predicate). Using
      centroids guarantees that each building is assigned to exactly one
      statistical unit, even when footprint edges touch a unit boundary.
    schema:
      allOf:
        - format: geojson-feature-collection
        - "$ref": "https://geojson.org/schema/FeatureCollection.json"
        - "$ref": "https://gitlab.opencode.de/lgvhh/udp/urban-pluvial-flood-risk-mapping/-/raw/main/schemas/statistical-units-schema.json"
    minOccurs: 0
    maxOccurs: 1
  flood_layers:
    title: "Flood Layers — All Depth Classes"
    description: >-
      Combined GeoJSON FeatureCollection containing flooded-area polygons for
      all water-depth classes. Each feature must carry a 'level_cm' property
      (integer, typically 20–100 cm in 10 cm increments). The well-being hazard
      pipeline (Steps 4.1–4.2) groups features by 'level_cm' and processes each
      depth class independently. The mobility & accessibility hazard pipeline
      (Steps 3.1–3.2) uses only features matching
      'hazard_params.ma_flood_level_cm' (default: 30 cm).
    schema:
      allOf:
        - format: geojson-feature-collection
        - "$ref": "https://geojson.org/schema/FeatureCollection.json"
        - "$ref": "https://gitlab.opencode.de/lgvhh/udp/urban-pluvial-flood-risk-mapping/-/raw/main/schemas/flood-layers-schema.json"
    minOccurs: 1
    maxOccurs: 1
  params:
    title: "Pipeline Parameters (optional)"
    description: >-
      JSON object for overriding algorithm defaults. All fields are optional;
      omitting this input applies the paper-derived defaults (Vogelbacher et
      al., 2025).
    schema:
      type: object
      properties:
        vulnerability_weights:
          type: object
          properties:
            children_under_10:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.3
            elderly_singles_over_65:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.7
            single_parents:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.0
              description: >-
                Sensitivity weight for single-parent households. Default 0
                excludes this indicator. Set > 0 and adjust other sensitivity
                weights to sum to 1.0.
            social_welfare_recipients:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.5
            no_highschool_diploma:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.5
            sensitivity:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.5
            coping_capacity:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.5
            apply_entropy:
              type: boolean
              default: true
              description: Apply Shannon entropy weighting to TOPSIS scores
        flood_sensitivity_params:
          type: object
          properties:
            threshold_fraction:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 0.25
              description: Fraction of mean SVI added as floor value (Eq. 7)
            exponent:
              type: integer
              minimum: 1
              default: 2
              maximum: 3
              description: Power applied to shifted SVI (Eq. 7)
        hazard_params:
          type: object
          properties:
            buffer_building_m:
              type: number
              minimum: 0.0
              default: 2.0
              description: Buffer radius around buildings for HWB [m]
            buffer_street_inner_m:
              type: number
              minimum: 0.0
              default: 15.0
              description: Inner street buffer radius for HMA [m]
            buffer_street_outer_m:
              type: number
              minimum: 0.0
              default: 30.0
              description: Outer street buffer radius for HMA [m]
            buffer_access_m:
              type: number
              minimum: 0.0
              default: 5.0
              description: Direct access buffer radius for HMA [m]
            min_street_flood_area_m2:
              type: number
              minimum: 0.0
              default: 4.0
              description: Minimum flooded street area to include in HMA [m²]
            lognormal_shape:
              type: number
              minimum: 0.0
              default: 0.25
              description: Shape parameter σ of the log-normal CDF (Eq. 11)
            ma_flood_level_cm:
              type: integer
              minimum: 20
              maximum: 100
              multipleOf: 10
              default: 30
              description: >-
                Water depth class [cm] from flood_layers used for the mobility
                & accessibility hazard (Steps 3.1-3.2)
        risk_weights:
          type: object
          properties:
            hazard_exponent:
              type: number
              minimum: 0.0
              default: 1.0
              description: Exponent a applied to hazard index (Eq. 14/15)
            exposure_exponent:
              type: number
              minimum: 0.0
              default: 1.0
              description: Exponent b applied to exposure index (Eq. 14/15)
            vulnerability_exponent:
              type: number
              minimum: 0.0
              default: 1.0
              description: Exponent c applied to vulnerability index (Eq. 14/15)
            n_classification_iterations:
              type: integer
              minimum: 1
              default: 4
              description: Number of head/tail break iterations for risk classification
        target_crs:
          type: string
          default: null
          examples:
            - EPSG:25832
            - http://www.opengis.net/def/crs/EPSG/0/25832
            - urn:ogc:def:crs:EPSG::25832
            - EPSG:32632
            - EPSG:2263
          description: >-
            CRS identifier for all spatial calculations. Accepted forms include
            EPSG tokens, OGC CRS URIs, OGC URNs, and proj strings. Required when
            inputs carry projected (metric) coordinates (e.g. 'EPSG:25832' for
            Hamburg / ETRS89 UTM-32N). Omit for standard WGS-84 GeoJSON — UTM
            zone is then auto-detected from the input data centroid.
        healpix_params:
          type: object
          properties:
            depth:
              type: integer
              minimum: 1
              maximum: 29
              default: 15
              description: >-
                HEALPix depth (nside = 2^depth). depth=15 → ~0.8 km² per cell at
                mid-latitudes. depth=12 → ~50 km² (district level). depth=17 →
                ~50 m² (building cluster level).
            agg_func:
              type: string
              enum:
                - mean
                - max
                - sum
                - median
              default: mean
              description: >-
                Aggregation function applied to all risk columns. Use 'max' for
                worst-case mapping, 'mean' for average exposure.
            min_buildings:
              type: integer
              minimum: 1
              default: 3
              description: >-
                Minimum number of buildings per HEALPix cell required for the
                cell to appear in the output (privacy threshold).
            columns:
              type: array
              items:
                type: string
              default: null
              description: >-
                Explicit list of columns to aggregate. Omit to use all available
                risk/hazard columns (PFRWB, PFRMA, HWB, HMA,
                social_vulnerability_index, …).
        output:
          type: object
          properties:
            include_input_building_properties:
              type: boolean
              default: false
              description: >-
                Include selected original building properties in the output
                feature properties.
            decimal_precision:
              anyOf:
                - type: integer
                  minimum: 0
                - type: null
              minimum: 0
              default: 4
              description: >-
                Number of decimal places used for serialized floating-point
                outputs. Set to null to disable rounding.
    minOccurs: 0
    maxOccurs: 1
outputs:
  risk_buildings:
    title: "Risk Buildings"
    description: >-
      GeoJSON FeatureCollection of building footprints enriched with all
      computed columns: sensitivity_index, coping_capacity_index,
      social_vulnerability_index, social_vulnerability_flood_potential,
      residents_per_building, residents_ground_floor, hazard_well_being,
      hazard_mobility_accessibility, pluvial_flood_risk_well_being,
      pluvial_flood_risk_mobility_accessibility, risk_class_wb, risk_class_ma.
    schema:
      allOf:
        - format: geojson-feature-collection
        - "$ref": "https://geojson.org/schema/FeatureCollection.json"
  classification_breaks_wb:
    title: "Classification Breaks — Well-Being"
    description: >-
      Head/tail break thresholds for pluvial_flood_risk_well_being. Use as class
      boundaries for cartographic visualisation.
    schema:
      type: array
      items:
        type: number
  classification_breaks_ma:
    title: "Classification Breaks — Mobility & Accessibility"
    description: >-
      Head/tail break thresholds for pluvial_flood_risk_mobility_accessibility.
    schema:
      type: array
      items:
        type: number
  healpix_aggregation:
    title: "HEALPix Aggregated Risk & Vulnerability"
    description: >-
      Building-level risk and vulnerability indicators aggregated to HEALPix
      cells on the WGS84 ellipsoid (crs: EPSG:4326). Cell resolution is
      controlled by 'params.healpix_params.depth' (default: 15, ~0.8 km² per
      cell at mid-latitudes). Cells with fewer buildings than
      'params.healpix_params.min_buildings' are suppressed (privacy threshold).
      Aggregated columns: PFRWB, PFRMA, HWB, HMA,
      social_vulnerability_index, social_vulnerability_flood_potential,
      sensitivity_index, coping_capacity_index, n_buildings. Supported
      encodings: GeoJSON (default), FlatGeobuf, PNG image (choropleth,
      base64-encoded inline value).
    schema:
      oneOf:
        - description: "GeoJSON FeatureCollection (default)"
          allOf:
            - format: geojson-feature-collection
            - "$ref": "https://geojson.org/schema/FeatureCollection.json"
        - description: "FlatGeobuf binary encoding"
          type: string
          contentEncoding: binary
          contentMediaType: application/flatgeobuf
        - description: >-
            Rendered choropleth map as a base64-encoded PNG. Suitable for
            inline display when no GIS client is available.
          type: string
          contentEncoding: base64
          contentMediaType: image/png
  risk_statistical_units:
    title: "Statistical Unit Aggregates"
    description: >-
      All computed building-level indicators aggregated to statistical unit
      polygons (mean per unit unless overridden). Requires the
      'statistical_units' input to be present. Aggregated columns match
      risk_buildings: sensitivity_index, coping_capacity_index,
      social_vulnerability_index, social_vulnerability_flood_potential,
      residents_per_building, residents_ground_floor, hazard_well_being,
      hazard_mobility_accessibility, pluvial_flood_risk_well_being,
      pluvial_flood_risk_mobility_accessibility, risk_class_wb, risk_class_ma,
      n_buildings. Output CRS matches 'params.target_crs' (or EPSG:4326 fallback).
    schema:
      oneOf:
        - description: "GeoJSON FeatureCollection (default)"
          allOf:
            - format: geojson-feature-collection
            - "$ref": "https://geojson.org/schema/FeatureCollection.json"
        - description: "FlatGeobuf binary encoding"
          type: string
          contentEncoding: binary
          contentMediaType: application/flatgeobuf
  validation_report:
    title: "Validation Report"
    description: >-
      JSON summary of buildings dropped during pipeline execution, grouped by
      omission cause. Enables graceful partial execution: the pipeline continues
      with valid features and reports which buildings were excluded and why.
      Causes include: missing_required_property, invalid_geometry,
      crs_unprojectable, join_no_statistical_unit,
      negative_or_zero_floor_area, out_of_flood_layer_extent. Fields:
      total_input, total_processed, total_dropped, drop_summary [{cause, count,
      example_ids[]}].
    schema:
      type: object
      required:
        - total_input
        - total_processed
        - total_dropped
        - drop_summary
      properties:
        total_input:
          type: integer
          minimum: 0
        total_processed:
          type: integer
          minimum: 0
        total_dropped:
          type: integer
          minimum: 0
        drop_summary:
          type: array
          items:
            type: object
            required:
              - cause
              - count
            properties:
              cause:
                type: string
                enum:
                  - missing_required_property
                  - invalid_geometry
                  - crs_unprojectable
                  - join_no_statistical_unit
                  - negative_or_zero_floor_area
                  - out_of_flood_layer_extent
              count:
                type: integer
                minimum: 1
              example_ids:
                type: array
                items:
                  type: string
                maxItems: 10
                description: "Up to 10 feature IDs for debugging"
  validation_dropped_buildings:
    title: "Dropped Buildings (Spatial)"
    description: >-
      GeoJSON FeatureCollection (or FlatGeobuf) of all building features
      excluded from processing. Each feature retains its original geometry and
      properties, extended with 'omission_cause' (string) and 'omission_detail'
      (string, human-readable explanation). Useful for spatial QA — load
      directly into a GIS to review which areas are affected.
    schema:
      oneOf:
        - description: "GeoJSON FeatureCollection (default)"
          allOf:
            - format: geojson-feature-collection
            - "$ref": "https://geojson.org/schema/FeatureCollection.json"
        - description: "FlatGeobuf binary encoding"
          type: string
          contentEncoding: binary
          contentMediaType: application/flatgeobuf
keywords:
  - flood
  - risk
  - pluvial
  - IPCC
  - vulnerability
  - hazard
  - urban
